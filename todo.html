<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="img/vf_icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/vf_icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ToDo List - VF SMS</title>
    <link rel="icon" href="img/vf_icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .add-task-form {
            background: var(--white);
            border: 2px solid var(--white-border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }
        
        .add-task-form h3 {
            color: var(--vf-red);
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        
        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .form-row input {
            flex: 1;
            min-width: 200px;
            margin-bottom: 0;
        }
        
        .form-row select {
            flex: 0 0 auto;
            min-width: 150px;
            margin-bottom: 0;
        }
        
        .form-row button {
            flex: 0 0 auto;
        }
        
        .btn-add {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5);
        }
        
        .filter-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid var(--vf-red);
            background: var(--white);
            color: var(--vf-red);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .filter-btn.active {
            background: var(--vf-red);
            color: white;
        }
        
        .filter-btn:hover:not(.active) {
            background: rgba(214, 40, 40, 0.1);
        }
        
        .tasks-stats {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .stat-box {
            background: var(--white);
            border: 2px solid var(--white-border);
            border-radius: 12px;
            padding: 12px 20px;
            color: var(--vf-red-dark);
            font-size: 14px;
            font-weight: 500;
        }
        
        .stat-box span {
            font-weight: 700;
            font-size: 18px;
            color: var(--vf-red);
        }
        
        .tasks-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .task-item {
            background: var(--white);
            border: 2px solid var(--white-border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.3s ease;
        }
        
        .task-item:hover {
            border-color: var(--vf-red);
            transform: translateX(4px);
        }
        
        .task-item.completed {
            opacity: 0.6;
        }
        
        .task-item.completed .task-title {
            text-decoration: line-through;
        }
        
        .task-checkbox {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 2px solid var(--white-border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
            accent-color: var(--vf-red);
        }
        
        .task-checkbox:hover {
            border-color: var(--vf-red);
        }
        
        .task-content {
            flex: 1;
            min-width: 0;
        }
        
        .task-title {
            color: var(--vf-red-dark);
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
            word-break: break-word;
        }
        
        .task-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .task-priority {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 500;
        }
        
        .priority-high {
            background: rgba(239, 68, 68, 0.15);
            color: #dc2626;
        }
        
        .priority-medium {
            background: rgba(251, 191, 36, 0.15);
            color: #b45309;
        }
        
        .priority-low {
            background: rgba(34, 197, 94, 0.15);
            color: #15803d;
        }
        
        .task-date {
            font-size: 12px;
            color: #666;
        }
        
        .task-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        
        .btn-action {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .btn-edit {
            background: rgba(59, 130, 246, 0.15);
            color: #2563eb;
        }
        
        .btn-edit:hover {
            background: rgba(59, 130, 246, 0.3);
            transform: scale(1.1);
        }
        
        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: #dc2626;
        }
        
        .btn-delete:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: scale(1.1);
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .empty-state span {
            font-size: 48px;
            display: block;
            margin-bottom: 16px;
        }
        
        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: var(--vf-red-dark);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: var(--white);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            border: 2px solid var(--white-border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .modal h2 {
            color: var(--vf-red);
            font-size: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .modal input,
        .modal select {
            width: 100%;
            margin-bottom: 16px;
        }
        
        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        
        .modal-buttons button {
            flex: 1;
        }
        
        .btn-cancel {
            background: var(--white);
            color: #666;
            border: 2px solid var(--white-border);
        }
        
        .btn-cancel:hover {
            background: #f5f5f5;
        }
        
        .btn-save {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
        }
        
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }
        
        .btn-delete-confirm {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }
        
        .btn-delete-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
        }
        
        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
            }
            
            .task-item {
                flex-wrap: wrap;
            }
            
            .task-actions {
                width: 100%;
                justify-content: flex-end;
                margin-top: 12px;
            }
            
            .modal-content {
                padding: 20px;
            }
            
            .modal-buttons {
                flex-direction: column;
            }
            
            .modal-buttons button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📋 ToDo List</h2>
    
    <!-- Add Task Form -->
    <div class="add-task-form">
        <h3>➕ Add New Task</h3>
        <div class="form-row">
            <input type="text" id="taskInput" placeholder="Enter your task...">
            <select id="prioritySelect">
                <option value="low">Low Priority</option>
                <option value="medium" selected>Medium Priority</option>
                <option value="high">High Priority</option>
            </select>
            <button class="btn-add" onclick="addTask()">Add Task</button>
        </div>
    </div>
    
    <!-- Filter Buttons -->
    <div class="filter-buttons">
        <button class="filter-btn active" onclick="filterTasks('all')">All</button>
        <button class="filter-btn" onclick="filterTasks('pending')">Pending</button>
        <button class="filter-btn" onclick="filterTasks('completed')">Completed</button>
    </div>
    
    <!-- Stats -->
    <div class="tasks-stats">
        <div class="stat-box">Total: <span id="totalTasks">0</span></div>
        <div class="stat-box">Completed: <span id="completedTasks">0</span></div>
        <div class="stat-box">Pending: <span id="pendingTasks">0</span></div>
    </div>
    
    <!-- Tasks List -->
    <div class="tasks-list" id="tasksList">
    </div>
</div>

<!-- Edit Modal -->
<div class="modal" id="editModal">
    <div class="modal-content">
        <h2>✏️ Edit Task</h2>
        <input type="hidden" id="editTaskId">
        <input type="text" id="editTaskInput" placeholder="Task title">
        <select id="editPrioritySelect">
            <option value="low">Low Priority</option>
            <option value="medium">Medium Priority</option>
            <option value="high">High Priority</option>
        </select>
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
            <button class="btn-save" onclick="saveEdit()">Save</button>
        </div>
    </div>
</div>

<!-- Delete Modal -->
<div class="modal" id="deleteModal">
    <div class="modal-content">
        <h2>🗑️ Delete Task</h2>
        <p style="text-align:center;color:#666;margin-bottom:20px">Are you sure you want to delete this task?</p>
        <input type="hidden" id="deleteTaskId">
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
            <button class="btn-delete-confirm" onclick="confirmDelete()">Delete</button>
        </div>
    </div>
</div>

<!-- Navbar -->
<nav class="navbar">
    <div class="nav-items">
        <a href="index.html" class="nav-item">
            <i class="nav-icon fa-solid fa-paper-plane"></i>
            <span class="nav-label">SMS</span>
        </a>
        <a href="cst.html" class="nav-item">
            <i class="nav-icon fa-solid fa-users"></i>
            <span class="nav-label">CST</span>
        </a>
        <a href="sr-sku.html" class="nav-item">
            <i class="nav-icon fa-solid fa-list-ol"></i>
            <span class="nav-label">SR & SKU</span>
        </a>
        <a href="schedule.html" class="nav-item">
            <i class="nav-icon fa-solid fa-calendar-days"></i>
            <span class="nav-label">Schedule</span>
        </a>
        <a href="todo.html" class="nav-item active">
            <i class="nav-icon fa-solid fa-clipboard-list"></i>
            <span class="nav-label">ToDo</span>
        </a>
    </div>
</nav>

<script>
let tasks = JSON.parse(localStorage.getItem('vfTodoTasks')) || [];
let currentFilter = 'all';

function saveTasks() {
    localStorage.setItem('vfTodoTasks', JSON.stringify(tasks));
    renderTasks();
}

function addTask() {
    const input = document.getElementById('taskInput');
    const priority = document.getElementById('prioritySelect');
    
    if (!input.value.trim()) {
        alert('Please enter a task');
        return;
    }
    
    const task = {
        id: Date.now(),
        title: input.value.trim(),
        priority: priority.value,
        completed: false,
        date: new Date().toISOString()
    };
    
    tasks.push(task);
    input.value = '';
    priority.value = 'medium';
    saveTasks();
}

function toggleTask(id) {
    const task = tasks.find(t => t.id === id);
    if (task) {
        task.completed = !task.completed;
        saveTasks();
    }
}

function deleteTask(id) {
    document.getElementById('deleteTaskId').value = id;
    document.getElementById('deleteModal').classList.add('active');
}

function confirmDelete() {
    const id = parseInt(document.getElementById('deleteTaskId').value);
    tasks = tasks.filter(t => t.id !== id);
    closeDeleteModal();
    saveTasks();
}

function closeDeleteModal() {
    document.getElementById('deleteModal').classList.remove('active');
}

function editTask(id) {
    const task = tasks.find(t => t.id === id);
    if (task) {
        document.getElementById('editTaskId').value = id;
        document.getElementById('editTaskInput').value = task.title;
        document.getElementById('editPrioritySelect').value = task.priority;
        document.getElementById('editModal').classList.add('active');
    }
}

function saveEdit() {
    const id = parseInt(document.getElementById('editTaskId').value);
    const task = tasks.find(t => t.id === id);
    if (task) {
        task.title = document.getElementById('editTaskInput').value.trim();
        task.priority = document.getElementById('editPrioritySelect').value;
        closeEditModal();
        saveTasks();
    }
}

function closeEditModal() {
    document.getElementById('editModal').classList.remove('active');
}

function filterTasks(filter) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    event.target.classList.add('active');
    renderTasks();
}

function renderTasks() {
    const container = document.getElementById('tasksList');
    
    let filtered = tasks;
    if (currentFilter === 'pending') {
        filtered = tasks.filter(t => !t.completed);
    } else if (currentFilter === 'completed') {
        filtered = tasks.filter(t => t.completed);
    }
    
    document.getElementById('totalTasks').textContent = tasks.length;
    document.getElementById('completedTasks').textContent = tasks.filter(t => t.completed).length;
    document.getElementById('pendingTasks').textContent = tasks.filter(t => !t.completed).length;
    
    if (filtered.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <span>📝</span>
                <h3>No tasks yet</h3>
                <p>Add a task above to get started</p>
            </div>
        `;
        return;
    }
    
    container.innerHTML = filtered.map(task => `
        <div class="task-item ${task.completed ? 'completed' : ''}">
            <input type="checkbox" class="task-checkbox" 
                ${task.completed ? 'checked' : ''} 
                onchange="toggleTask(${task.id})">
            <div class="task-content">
                <div class="task-title">${task.title}</div>
                <div class="task-meta">
                    <span class="task-priority priority-${task.priority}">${task.priority}</span>
                    <span class="task-date">${new Date(task.date).toLocaleDateString()}</span>
                </div>
            </div>
            <div class="task-actions">
                <button class="btn-action btn-edit" onclick="editTask(${task.id})">✏️</button>
                <button class="btn-action btn-delete" onclick="deleteTask(${task.id})">🗑️</button>
            </div>
        </div>
    `).join('');
}

document.getElementById('editModal').addEventListener('click', function(e) {
    if (e.target === this) {
        closeEditModal();
    }
});

document.getElementById('deleteModal').addEventListener('click', function(e) {
    if (e.target === this) {
        closeDeleteModal();
    }
});

renderTasks();
</script>

</body>
</html>

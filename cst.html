<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="img/vf_icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/vf_icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CST Data - VF SMS</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="container">
    <h2>👥 CST Data</h2>

    <h3>➕ Add New Customer</h3>
    <div class="input-grid">
        <div class="input-wrapper">
            <label class="floating-label">Customer Name</label>
            <input type="text" id="customerName" placeholder=" Customer Name"> 
        </div>
        <div class="input-wrapper">
            <label class="floating-label">Phone Number</label>
            <input type="tel" id="customerPhone" placeholder=" Phone Number">
        </div>
        <div class="input-wrapper">
            <select id="serviceType">
                <option value="">Select Service Type</option>
                <option value="Postpaid">Postpaid</option>
                <option value="Prepaid">Prepaid</option>
                <option value="@Home">@Home</option>
                <option value="ADSL">ADSL</option>
                <option value="Enterprise">Enterprise</option>
                <option value="Device">Device</option>
                <option value="Sim Swap">Sim Swap</option>
                <option value="MNP">MNP</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="input-wrapper">
            <select id="orderStatus">
                <option value="Pending">Pending</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
                <option value="In Progress">In Progress</option>
            </select>
        </div>
    </div>

    <label>Notes</label>
    <textarea id="customerNotes" placeholder="Add any notes about this customer..."></textarea>

    <div class="button-group">
        <button class="btn-primary" onclick="saveCustomer()">💾 Save Customer</button>
        <button class="btn-secondary" onclick="clearForm()">🔄 Clear Form</button>
    </div>

    <h3>📋 Customers List</h3>
    <div class="cards-grid" id="customerCards">
    </div>
</div>

<!-- Customer Detail Modal -->
<div class="modal" id="customerModal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <div class="modal-body" id="modalBody">
        </div>
    </div>
</div>

<script>
// ===== Load Customers from LocalStorage =====
let customers = JSON.parse(localStorage.getItem('cstCustomers')) || [];

function renderCustomers() {
    const container = document.getElementById('customerCards');
    container.innerHTML = '';

    if (customers.length === 0) {
        container.innerHTML = '<div style="text-align:center;color:rgba(255,255,255,0.5);grid-column:1/-1;padding:40px">No customers yet</div>';
        return;
    }

    customers.forEach((customer, index) => {
        let statusClass = '';
        if (customer.status === 'Completed') statusClass = 'status-completed';
        else if (customer.status === 'Cancelled') statusClass = 'status-cancelled';
        else statusClass = 'status-pending';

        const cardDate = customer.date ? new Date(customer.date).toLocaleDateString() : '-';

        const card = `
            <div class="customer-card" onclick="showCustomerDetail(${index})">
                <div class="card-header">
                    <div>
                        <h4 class="card-name">${customer.name}</h4>
                        <p class="card-phone">${customer.phone}</p>
                    </div>
                    <span class="status-badge ${statusClass}">${customer.status}</span>
                </div>
                <span class="card-service">${customer.service}</span>
                <div class="card-footer">
                    <span class="card-date">${cardDate}</span>
                    <div class="action-btns" onclick="event.stopPropagation()">
                        <button class="btn-whatsapp" onclick="sendWhatsApp('${customer.phone}')">💬</button>
                        <button class="btn-call" onclick="makeCall('${customer.phone}')">📞</button>
                        <button class="edit-btn" onclick="editCustomer(${index})">✏️</button>
                        <button class="delete-btn" onclick="deleteCustomer(${index})">🗑️</button>
                    </div>
                </div>
            </div>
        `;
        container.innerHTML += card;
    });
}

function showCustomerDetail(index) {
    const customer = customers[index];
    let statusClass = '';
    if (customer.status === 'Completed') statusClass = 'status-completed';
    else if (customer.status === 'Cancelled') statusClass = 'status-cancelled';
    else statusClass = 'status-pending';

    const cardDate = customer.date ? new Date(customer.date).toLocaleDateString() : '-';
    const cardTime = customer.date ? new Date(customer.date).toLocaleTimeString() : '-';

    document.getElementById('modalBody').innerHTML = `
        <div class="modal-header">
            <div>
                <h3 class="modal-title">${customer.name}</h3>
                <p class="modal-subtitle">${customer.phone}</p>
            </div>
            <span class="status-badge ${statusClass}">${customer.status}</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Service Type</span>
            <span class="detail-value">${customer.service}</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Date Added</span>
            <span class="detail-value">${cardDate}</span>
        </div>
        <div class="detail-row">
            <span class="detail-label">Time</span>
            <span class="detail-value">${cardTime}</span>
        </div>
        <div class="detail-notes">
            <div class="detail-notes-label">Notes</div>
            <div class="detail-notes-text">${customer.notes || 'No notes'}</div>
        </div>
        <div class="modal-actions">
            <button class="btn-whatsapp" onclick="sendWhatsApp('${customer.phone}');closeModal()">💬 WhatsApp</button>
            <button class="btn-call" onclick="makeCall('${customer.phone}');closeModal()">📞 Call</button>
        </div>
        <div class="modal-actions">
            <button class="edit-btn" onclick="editCustomer(${index});closeModal()">✏️ Edit</button>
            <button class="delete-btn" onclick="deleteCustomer(${index});closeModal()">🗑️ Delete</button>
        </div>
    `;
    document.getElementById('customerModal').classList.add('active');
}

function closeModal() {
    document.getElementById('customerModal').classList.remove('active');
}

document.getElementById('customerModal').addEventListener('click', function(e) {
    if (e.target === this) {
        closeModal();
    }
});

function saveCustomer() {
    const name = document.getElementById('customerName').value;
    const phone = document.getElementById('customerPhone').value;
    const service = document.getElementById('serviceType').value;
    const status = document.getElementById('orderStatus').value;
    const notes = document.getElementById('customerNotes').value;

    if (!name || !phone) {
        alert('Please enter customer name and phone number');
        return;
    }

    const customer = {
        name: name,
        phone: phone,
        service: service || 'Other',
        status: status,
        notes: notes,
        date: new Date().toISOString()
    };

    customers.push(customer);
    localStorage.setItem('cstCustomers', JSON.stringify(customers));
    renderCustomers();
    clearForm();
}

function deleteCustomer(index) {
    if (confirm('Are you sure you want to delete this customer?')) {
        customers.splice(index, 1);
        localStorage.setItem('cstCustomers', JSON.stringify(customers));
        renderCustomers();
    }
}

function editCustomer(index) {
    const customer = customers[index];
    document.getElementById('customerName').value = customer.name;
    document.getElementById('customerPhone').value = customer.phone;
    document.getElementById('serviceType').value = customer.service;
    document.getElementById('orderStatus').value = customer.status;
    document.getElementById('customerNotes').value = customer.notes;
    
    // Store the index for update
    document.getElementById('customerName').dataset.editIndex = index;
    
    // Change button text to indicate update mode
    const saveBtn = document.querySelector('.btn-primary');
    saveBtn.innerHTML = '💾 Update Customer';
    saveBtn.onclick = function() { updateCustomer(index); };
    
    // Scroll to form
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateCustomer(index) {
    const name = document.getElementById('customerName').value;
    const phone = document.getElementById('customerPhone').value;
    const service = document.getElementById('serviceType').value;
    const status = document.getElementById('orderStatus').value;
    const notes = document.getElementById('customerNotes').value;

    if (!name || !phone) {
        alert('Please enter customer name and phone number');
        return;
    }

    customers[index] = {
        name: name,
        phone: phone,
        service: service || 'Other',
        status: status,
        notes: notes,
        date: customers[index].date // Keep original date
    };

    localStorage.setItem('cstCustomers', JSON.stringify(customers));
    renderCustomers();
    clearForm();
    
    // Reset button
    const saveBtn = document.querySelector('.btn-primary');
    saveBtn.innerHTML = '💾 Save Customer';
    saveBtn.onclick = function() { saveCustomer(); };
}

function clearForm() {
    document.getElementById('customerName').value = '';
    document.getElementById('customerPhone').value = '';
    document.getElementById('serviceType').value = '';
    document.getElementById('orderStatus').value = 'Pending';
    document.getElementById('customerNotes').value = '';
    
    // Reset button
    const saveBtn = document.querySelector('.btn-primary');
    saveBtn.innerHTML = '💾 Save Customer';
    saveBtn.onclick = function() { saveCustomer(); };
}

function sendWhatsApp(phone) {
    // Remove any non-digit characters from phone
    const cleanPhone = phone.replace(/\D/g, '');
    // Check if it already has country code
    const formattedPhone = cleanPhone.startsWith('20') ? cleanPhone : '20' + cleanPhone;
    window.open(`https://wa.me/${formattedPhone}`, '_blank');
}

function makeCall(phone) {
    window.open(`tel:${phone}`, '_blank');
}

// Floating Labels
const inputs = document.querySelectorAll('input');
inputs.forEach(input => {
    input.addEventListener('input', function() {
        if (this.value) {
            this.classList.add('has-value');
        } else {
            this.classList.remove('has-value');
        }
    });
});

// Initial render
renderCustomers();
</script>

    <div class="nav-items">
        <a href="index.html" class="nav-item">
            <i class="nav-icon fa-solid fa-paper-plane"></i>

        </a>
        <a href="cst.html" class="nav-item active">
            <i class="nav-icon fa-solid fa-users"></i>
            <span class="nav-label">CST</span>
        </a>
        <a href="sr-sku.html" class="nav-item">
            <i class="nav-icon fa-solid fa-list-ol"></i>
            <span class="nav-label">SR & SKU</span>
        </a>
        <a href="schedule.html" class="nav-item">
            <i class="nav-icon fa-solid fa-calendar-days"></i>
            <span class="nav-label">Schedule</span>
        </a>
        <a href="todo.html" class="nav-item">
            <i class="nav-icon fa-solid fa-clipboard-list"></i>
            <span class="nav-label">ToDo</span>
        </a>
    </div>
</nav>

</body>
</html>
